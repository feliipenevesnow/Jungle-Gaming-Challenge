name: Validate marketplace
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm.cmd ci
      - run: Copy-Item .env.example .env
      - run: npx.cmd playwright install chromium
      - run: npm.cmd run typecheck
      - run: npm.cmd run lint
      - run: npm.cmd run build
      - run: npm.cmd run test:e2e -- --workers=2 --retries=0
      - run: npm.cmd run test:navigation
      - run: npm.cmd run test:visual
      - run: npm.cmd run test:production
      - run: npm.cmd run audit:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/
            artifacts/navigation-report/
            artifacts/navigation-results/
            artifacts/visual-report/
            artifacts/visual-results/
            artifacts/audit/
            lighthouse-report/
